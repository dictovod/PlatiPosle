name: Publish Windows release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish executable
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.2' }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          gh release create "$TAG" PlatiPosle.exe --verify-tag --title "PlatiPosle $TAG" --notes "Windows x64. SHA-256: $(sha256sum PlatiPosle.exe | cut -d ' ' -f 1)" --latest
